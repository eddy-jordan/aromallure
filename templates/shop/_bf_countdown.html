<div class="bf-countdown{% if compact %} bf-countdown--compact{% endif %}"
     data-bf-countdown
     data-seconds="{{ sale.seconds }}"
     role="timer"
     aria-label="{% if sale.phase == 'upcoming' %}Time until {{ sale.name }} starts{% else %}Time until {{ sale.name }} ends{% endif %}">
  <span class="bf-unit"><b data-unit="d">{{ sale.days }}</b><i>Days</i></span>
  <span class="bf-unit"><b data-unit="h">{{ sale.hours }}</b><i>Hrs</i></span>
  <span class="bf-unit"><b data-unit="m">{{ sale.minutes }}</b><i>Min</i></span>
  <span class="bf-unit"><b data-unit="s">{{ sale.secs }}</b><i>Sec</i></span>
</div>
